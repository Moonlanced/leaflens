<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeafLens Reader</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  html,body{overflow:hidden}
  .reader{display:flex;flex-direction:column;height:100%}
  .rbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex:0 0 auto}
  .rbar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
  .rbar .spacer{flex:1}
  .stage-wrap{flex:1;min-height:0;position:relative;background:radial-gradient(120% 90% at 50% 0%,#131313,#0a0a0a);overflow:hidden;display:grid;place-items:center}
  .stage{position:relative;transition:transform .18s ease;transform-origin:center center;will-change:transform}
  .book{position:relative;display:flex;box-shadow:0 30px 80px rgba(0,0,0,.6);border-radius:4px}
  .book .half{position:relative;background:#fff;overflow:hidden}
  .book .half canvas{display:block;width:100%;height:100%}
  .book .spine{position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28));pointer-events:none;z-index:4}
  .leaf{position:absolute;top:0;z-index:6;transform-style:preserve-3d;pointer-events:none}
  .leaf .face{position:absolute;inset:0;background-size:100% 100%;backface-visibility:hidden;box-shadow:0 0 30px rgba(0,0,0,.35)}
  .lnk{position:absolute;z-index:5;border:1.5px solid rgba(57,135,229,0);border-radius:3px;background:rgba(57,135,229,0);cursor:pointer;transition:background .12s,border-color .12s}
  .reveal-links .lnk{background:rgba(57,135,229,.14);border-color:rgba(57,135,229,.55)}
  .lnk:hover{background:rgba(57,135,229,.22);border-color:var(--s1)}
  .lnk.sponsor{border-color:rgba(217,89,38,.6)}
  .reveal-links .lnk.sponsor{background:rgba(217,89,38,.16)}
  .toolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border);background:var(--surface);flex-wrap:wrap;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .pageind{min-width:110px;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .pageind b{color:var(--ink)}
  .search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:0 8px;height:32px}
  .search input{background:transparent;border:none;outline:none;color:var(--ink);width:150px}
  .grp{display:flex;align-items:center;gap:4px}
  .rail{position:absolute;right:0;top:0;bottom:0;width:150px;border-left:1px solid var(--border);background:var(--surface);overflow:auto;padding:10px;display:none;z-index:8}
  .rail.open{display:block}
  .thumb{border:2px solid transparent;border-radius:6px;overflow:hidden;margin-bottom:9px;cursor:pointer;position:relative;background:#fff}
  .thumb.active{border-color:var(--s1)}
  .thumb canvas{display:block;width:100%}
  .thumb .n{position:absolute;bottom:3px;right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:0 4px;border-radius:4px}
  .loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,10,10,.6);z-index:20;gap:12px}
  .loading.off{display:none}
  .fatal{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px}
  .fatal.show{display:grid}
  .powered{color:var(--muted);font-size:11px}
  @media(max-width:620px){.rbar .title{max-width:48vw}.search input{width:90px}}
</style>
</head>
<body>
<div class="reader">
  <div class="rbar">
    <div class="brand"><span class="logo">📖</span></div>
    <div class="title" id="title">Loading…</div>
    <div class="spacer"></div>
    <a class="powered" href="/" target="_blank" rel="noopener">powered by LeafLens</a>
  </div>
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage" style="display:none"><div class="book" id="book"></div></div>
    <div class="rail" id="rail"></div>
    <div class="loading" id="loading"><div class="spin"></div><div id="loadingTxt">Loading document…</div></div>
    <div class="fatal" id="fatal"><div><h2 id="fatalTitle">Could not load this document</h2><p id="fatalMsg" style="color:var(--ink-2)"></p></div></div>
  </div>
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="grp">
      <button class="ic" id="prev" title="Previous (←)">‹</button>
      <div class="pageind" id="pageind">— / —</div>
      <button class="ic" id="next" title="Next (→)">›</button>
    </div>
    <div class="grp">
      <button class="ic" id="zoomOut" title="Zoom out">－</button>
      <button class="ic" id="zoomIn" title="Zoom in">＋</button>
      <button class="ic" id="spread" title="Single / double page">⧉</button>
      <button class="ic" id="railBtn" title="Thumbnails">☰</button>
    </div>
    <div class="search"><span style="color:var(--muted)">🔎</span><input id="searchInput" placeholder="Search…"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/assets/reader.js"></script>
</body>
</html>
