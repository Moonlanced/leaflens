services:
  leaflens:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # REQUIRED — generate with:  openssl rand -hex 32
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      # Set to "false" after you've created the accounts you want (locks down signup)
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-true}"
      # Set to "true" when served over HTTPS (behind a TLS reverse proxy)
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-60}"
      # URL-source mode:
      PDF_CACHE_TTL: "${PDF_CACHE_TTL:-600}"
      ALLOW_PRIVATE_FETCH: "${ALLOW_PRIVATE_FETCH:-false}"
      PORT: "8080"
      DATA_DIR: "/data"
    volumes:
      - leaflens-data:/data

volumes:
  leaflens-data:
